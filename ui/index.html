<!doctype html>
<html lang="en" data-theme="nebula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULATOR</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="nebulator.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="tint" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M17 9h25l9 9v37H17z" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
      <path d="M25 46V23l15 23V23" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="25" cy="16" r="2.6" fill="var(--accent)"/>
    </svg>
    <span class="word">NEBULATOR</span>
  </div>
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="tools">
    <button class="chip" id="themeBtn" title="Change theme"><i class="half"></i><span id="themeName">Nebula</span></button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="track" id="track" role="listbox" aria-label="Library"></div>
  <div class="slot" id="slot" aria-hidden="true"></div>
</main>

<section class="page" id="page" aria-live="polite"></section>

<footer class="bottom" id="bottom">
  <div class="meta">
    <div class="count" id="count"></div>
    <h1 class="title" id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="hints" aria-hidden="true">
    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> Browse</span>
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Section</span>
    <span><kbd>Enter</kbd> Launch</span>
  </div>
</footer>

<aside class="sheet" id="sheet" aria-hidden="true"></aside>
<div class="modal" id="modal" aria-hidden="true"></div>
<div class="running" id="running" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="api.js"></script>
<script src="sfx.js"></script>
<script src="skylanders-data.js"></script>
<script src="nebulator.js"></script>
<script src="page-skylanders.js"></script>
<script src="page-controls.js"></script>
<script src="page-misc.js"></script>
<script src="updater.js"></script>
<script>NEB.boot();</script>
</body>
</html>
